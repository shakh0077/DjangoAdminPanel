{% extends "base.html" %}
{% block title %}O‘quvchilar{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>O‘quvchilar</h1><div class="muted">Jami {{ student_count }} nafar</div></div>
  {% if perms.cards.add_student %}<a class="button" href="{% url 'student_add' %}">+ O‘quvchi qo‘shish</a>{% endif %}
</div>
<div class="panel">
  <div class="panel-head">
    <h2>O‘quvchilar ro‘yxati</h2>
    <form class="toolbar" method="get">
      <input type="hidden" name="q" value="{{ student_query }}">
      <select name="course" aria-label="Kurs bo‘yicha filtrlash">
        <option value="">Barcha kurslar</option>
        {% for course in courses %}<option value="{{ course.pk }}" {% if selected_course == course.pk|stringformat:"s" %}selected{% endif %}>{{ course.title }}</option>{% endfor %}
      </select>
      <select name="group" aria-label="Guruh bo‘yicha filtrlash">
        <option value="">Barcha guruhlar</option>
        <option value="none" {% if selected_group == 'none' %}selected{% endif %}>Guruh biriktirilmagan</option>
        {% for group in groups %}<option value="{{ group.pk }}" {% if selected_group == group.pk|stringformat:"s" %}selected{% endif %}>{{ group.name }}</option>{% endfor %}
      </select>
      <button class="button" type="submit">Filtrlash</button>
    </form>
  </div>
  {% include "student_table.html" %}
</div>
{% endblock %}
