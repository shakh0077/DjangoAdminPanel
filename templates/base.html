<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Boshqaruv paneli{% endblock %} | EduCenter</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#20283b;background:#f5f7fb;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}.shell{min-height:100vh;display:flex}
    .sidebar{width:248px;background:#17233c;color:#c4cce0;padding:26px 16px;flex-shrink:0}
    .brand{font-size:20px;font-weight:800;color:#fff;padding:0 12px 30px;letter-spacing:-.4px}
    .brand-mark{display:inline-grid;place-items:center;background:#7667f5;width:34px;height:34px;border-radius:11px;margin-right:9px}
    .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#77839e;padding:12px}
    .nav-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:#b8c2d8;padding:12px;border-radius:9px;margin:3px 0;font-size:14px}
    .nav-link:hover,.nav-link.active{background:#293754;color:#fff}.nav-icon{width:22px;text-align:center;color:#a6a0ff;font-size:16px}
    .sidebar-bottom{margin-top:32px;padding:16px 12px;border-top:1px solid #2a3650;font-size:12px;color:#8794ad}
    .main{flex:1;min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid #edf0f5;display:flex;align-items:center;justify-content:space-between;padding:0 38px}
    .breadcrumb{font-size:13px;color:#8790a3}.profile{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650}
    .avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eeedff;color:#6558db;font-weight:800}
    .content{max-width:1400px;margin:0 auto;padding:32px 38px 48px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}
    h1{font-size:25px;letter-spacing:-.6px;margin:0 0 7px;color:#20283b}.muted{color:#8b93a5;font-size:13px}
    .button{display:inline-flex;align-items:center;gap:8px;background:#6c5ce7;color:#fff;text-decoration:none;border:0;border-radius:8px;padding:11px 15px;font-weight:650;font-size:13px;cursor:pointer}
    .button:hover{background:#5849cf}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:25px}
    .stat,.panel{background:#fff;border:1px solid #edf0f5;border-radius:12px}.stat{padding:21px 22px;display:flex;align-items:center;justify-content:space-between}
    .stat-label{color:#8790a3;font-size:13px}.stat-value{font-size:29px;font-weight:750;margin-top:8px;letter-spacing:-1px}
    .stat-icon{display:grid;place-items:center;width:47px;height:47px;border-radius:12px;background:#f0efff;color:#6c5ce7;font-size:20px}
    .panel{overflow:hidden}.panel-head{padding:19px 22px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .panel-title{margin:0;font-size:15px;font-weight:700}.panel-link{font-size:12px;color:#695de4;text-decoration:none;font-weight:650}
    .table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#929bad;font-weight:650;background:#fbfcfe}
    th,td{padding:14px 20px;border-bottom:1px solid #f0f2f6}td{font-size:13px;color:#515b70}tbody tr:last-child td{border-bottom:0}
    .person{display:flex;align-items:center;gap:10px;font-weight:650;color:#293248}.person-avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#f0efff;color:#695de4;font-weight:750}
    .badge{display:inline-block;background:#eeedff;color:#6257d6;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:650}
    .empty{padding:35px 20px;text-align:center;color:#9098a8;font-size:13px}.toolbar{display:flex;align-items:center;gap:10px}
    select{background:#fff;border:1px solid #e4e8f0;border-radius:8px;padding:10px 12px;color:#485168;font:inherit;font-size:13px}
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:22px}
    .detail-item{padding:15px;background:#fafbfe;border-radius:9px}.detail-label{font-size:11px;color:#8b93a5;margin-bottom:7px}.detail-value{font-size:14px;font-weight:650;color:#30394e}
    @media(max-width:850px){.sidebar{width:205px}.content{padding:25px 20px}.topbar{padding:0 20px}}
    @media(max-width:640px){.shell{display:block}.sidebar{width:auto;padding:14px;display:flex;align-items:center;gap:12px;overflow-x:auto}.brand{padding:0;white-space:nowrap}.nav-label,.sidebar-bottom{display:none}.nav-link{white-space:nowrap;margin:0;padding:9px}.main{width:100%}.topbar{height:60px}.content{padding:22px 14px}.stats{grid-template-columns:1fr;gap:10px}.page-head{align-items:flex-start}h1{font-size:22px}.detail-grid{grid-template-columns:1fr}.profile span{display:none}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">E</span>EduCenter</div>
    <div class="nav-label">Asosiy menyu</div>
    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'dashboard' %}"><span class="nav-icon">⌂</span> Bosh sahifa</a>
    <a class="nav-link {% if '/students/' in request.path %}active{% endif %}" href="{% url 'student_list' %}"><span class="nav-icon">◎</span> O'quvchilar</a>
    <a class="nav-link {% if '/teachers/' in request.path %}active{% endif %}" href="{% url 'teacher_list' %}"><span class="nav-icon">◉</span> O'qituvchilar</a>
    <a class="nav-link {% if '/courses/' in request.path %}active{% endif %}" href="{% url 'course_list' %}"><span class="nav-icon">▤</span> Kurslar</a>
    <div class="sidebar-bottom">O'quv markaz boshqaruv tizimi</div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="breadcrumb">Boshqaruv paneli &nbsp; / &nbsp; {% block breadcrumb %}Bosh sahifa{% endblock %}</div><div class="profile"><div class="avatar">A</div><span>Administrator</span></div></header>
    <section class="content">{% block content %}{% endblock %}</section>
  </main>
</div>
</body>
</html>
